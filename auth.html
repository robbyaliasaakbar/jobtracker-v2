<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masuk - Job Tracker</title>
  <meta name="description" content="Login Job Tracker. Tanpa token, tidak bisa masuk.">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230C0C0C'/%3E%3Crect x='8' y='19' width='3.6' height='5' rx='1.2' fill='white' opacity='.5'/%3E%3Crect x='12.8' y='16' width='3.6' height='8' rx='1.2' fill='white' opacity='.75'/%3E%3Crect x='17.6' y='13' width='3.6' height='11' rx='1.2' fill='white'/%3E%3Cpath d='M8 12.5 15 8.5l4 2.5 5-5' stroke='%23D70000' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3Cpath d='M20.6 6H24v3.4' stroke='%23D70000' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round' fill='none'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { ink: '#0C0C0C', paper: '#FFFFFF', accent: '#D70000' },
          fontFamily: { display: ['Manrope', 'sans-serif'], body: ['Inter', 'sans-serif'] }
        }
      }
    };
  </script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-paper text-ink font-body antialiased min-h-screen flex flex-col">

  <header class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-5 w-full flex items-center gap-2.5">
    <svg class="w-8 h-8 shrink-0" viewBox="0 0 32 32" fill="none" aria-hidden="true">
      <rect width="32" height="32" rx="8" fill="#0C0C0C"/>
      <rect x="8" y="19" width="3.6" height="5" rx="1.2" fill="#FFFFFF" opacity="0.5"/>
      <rect x="12.8" y="16" width="3.6" height="8" rx="1.2" fill="#FFFFFF" opacity="0.75"/>
      <rect x="17.6" y="13" width="3.6" height="11" rx="1.2" fill="#FFFFFF"/>
      <path d="M8 12.5 15 8.5l4 2.5 5-5" stroke="#D70000" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M20.6 6H24v3.4" stroke="#D70000" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <p class="font-display font-extrabold tracking-tight text-sm md:text-base">JOB TRACKER<span class="text-accent">.</span></p>
  </header>

  <main class="flex-1 flex items-start sm:items-center justify-center px-4 py-8">
    <div class="w-full max-w-md bg-paper border border-black/10 rounded-2xl p-6 sm:p-8" data-reveal>
      <p class="eyebrow">Auth</p>
      <h1 id="auth-title" class="mt-3 font-display font-extrabold tracking-tight text-2xl sm:text-3xl">Masuk</h1>
      <p id="auth-sub" class="mt-2 text-sm text-neutral-600"></p>

      <div id="auth-msg" class="hidden mt-4 px-4 py-3 rounded-xl text-sm font-medium"></div>

      <!-- MODE: LOGIN -->
      <form id="form-login" class="mt-6 space-y-3">
        <input id="li-email" type="email" placeholder="Email" autocomplete="email" class="w-full px-3 py-2.5 border border-black/15 rounded-xl text-sm focus:ring-2 focus:ring-accent focus:border-accent">
        <div class="relative">
          <input id="li-pass" type="password" placeholder="Password" autocomplete="current-password" class="w-full px-3 py-2.5 pr-11 border border-black/15 rounded-xl text-sm focus:ring-2 focus:ring-accent focus:border-accent">
          <button type="button" data-lihat="li-pass" title="Lihat password" class="absolute right-2 top-1/2 -translate-y-1/2 px-2 py-1 text-base">👁</button>
        </div>
        <button class="btn-primary jt-btn w-full bg-ink text-white font-display font-bold text-xs tracking-[0.14em] uppercase rounded-xl px-4 py-3">Masuk</button>
        <div class="flex justify-between text-sm pt-1">
          <button type="button" data-goto="daftar" class="text-accent font-semibold hover:underline">Daftar</button>
          <button type="button" data-goto="lupa" class="text-neutral-500 hover:underline">Lupa password?</button>
        </div>
      </form>

      <!-- MODE: DAFTAR -->
      <form id="form-daftar" class="hidden mt-6 space-y-3">
        <input id="df-nama" type="text" placeholder="Nama lengkap" autocomplete="name" class="w-full px-3 py-2.5 border border-black/15 rounded-xl text-sm focus:ring-2 focus:ring-accent focus:border-accent">
        <input id="df-telp" type="tel" placeholder="Nomor telepon (08...)" autocomplete="tel" class="w-full px-3 py-2.5 border border-black/15 rounded-xl text-sm focus:ring-2 focus:ring-accent focus:border-accent">
        <input id="df-email" type="email" placeholder="Email" autocomplete="email" class="w-full px-3 py-2.5 border border-black/15 rounded-xl text-sm focus:ring-2 focus:ring-accent focus:border-accent">
        <div class="relative">
          <input id="df-pass" type="password" placeholder="Password (min 8 + huruf besar + angka)" autocomplete="new-password" class="w-full px-3 py-2.5 pr-11 border border-black/15 rounded-xl text-sm focus:ring-2 focus:ring-accent focus:border-accent">
          <button type="button" data-lihat="df-pass" title="Lihat password" class="absolute right-2 top-1/2 -translate-y-1/2 px-2 py-1 text-base">👁</button>
        </div>
        <div class="relative">
          <input id="df-pass2" type="password" placeholder="Ketik ulang password" autocomplete="new-password" class="w-full px-3 py-2.5 pr-11 border border-black/15 rounded-xl text-sm focus:ring-2 focus:ring-accent focus:border-accent">
          <button type="button" data-lihat="df-pass2" title="Lihat password" class="absolute right-2 top-1/2 -translate-y-1/2 px-2 py-1 text-base">👁</button>
        </div>
        <button class="btn-primary jt-btn w-full bg-ink text-white font-display font-bold text-xs tracking-[0.14em] uppercase rounded-xl px-4 py-3">Daftar + Kirim OTP</button>
        <button type="button" data-goto="login" class="w-full text-sm text-neutral-500 hover:underline pt-1">Sudah punya akun? Masuk</button>
      </form>

      <!-- MODE: VERIFIKASI OTP -->
      <form id="form-otp" class="hidden mt-6 space-y-3">
        <p class="text-sm text-neutral-600">Kode 6 digit dikirim ke <b id="otp-email">-</b> <span id="otp-cek">(cek inbox email kamu)</span>.</p>
        <input id="otp-kode" type="text" inputmode="numeric" placeholder="482913" class="w-full px-3 py-2.5 border border-black/15 rounded-xl text-sm tracking-[0.3em] text-center focus:ring-2 focus:ring-accent focus:border-accent">
        <button class="btn-primary jt-btn w-full bg-ink text-white font-display font-bold text-xs tracking-[0.14em] uppercase rounded-xl px-4 py-3">Verifikasi</button>
      </form>

      <!-- MODE: LUPA -->
      <form id="form-lupa" class="hidden mt-6 space-y-3">
        <input id="lp-email" type="email" placeholder="Email" class="w-full px-3 py-2.5 border border-black/15 rounded-xl text-sm focus:ring-2 focus:ring-accent focus:border-accent">
        <button class="btn-primary jt-btn w-full bg-ink text-white font-display font-bold text-xs tracking-[0.14em] uppercase rounded-xl px-4 py-3">Kirim OTP Reset</button>
        <button type="button" data-goto="login" class="w-full text-sm text-neutral-500 hover:underline pt-1">Kembali masuk</button>
      </form>

      <!-- MODE: RESET -->
      <form id="form-reset" class="hidden mt-6 space-y-3">
        <p class="text-sm text-neutral-600">Reset untuk <b id="reset-email">-</b>.</p>
        <input id="rs-kode" type="text" inputmode="numeric" placeholder="Kode OTP" class="w-full px-3 py-2.5 border border-black/15 rounded-xl text-sm tracking-[0.3em] text-center focus:ring-2 focus:ring-accent focus:border-accent">
        <div class="relative">
          <input id="rs-baru" type="password" placeholder="Password baru" autocomplete="new-password" class="w-full px-3 py-2.5 pr-11 border border-black/15 rounded-xl text-sm focus:ring-2 focus:ring-accent focus:border-accent">
          <button type="button" data-lihat="rs-baru" title="Lihat password" class="absolute right-2 top-1/2 -translate-y-1/2 px-2 py-1 text-base">👁</button>
        </div>
        <button class="btn-primary jt-btn w-full bg-ink text-white font-display font-bold text-xs tracking-[0.14em] uppercase rounded-xl px-4 py-3">Ganti Password</button>
      </form>
    </div>
  </main>

  <!-- JOB_API: sama kayak index.html, harus di atas auth.js -->
  <script>window.JOB_API = "https://aispec.tail06293c.ts.net";</script>
  <script src="js/auth.js"></script>
  <!-- Reveal kartu login: auth.html tidak load app.js, jadi observer-nya dipasang di sini (pola sama kayak app.js). Tanpa ini kartu opacity 0 selamanya di browser tanpa reduced-motion. -->
  <script>
  (function () {
    var els = document.querySelectorAll("[data-reveal]");
    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches || !("IntersectionObserver" in window)) {
      els.forEach(function (n) { n.classList.add("revealed"); });
      return;
    }
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        if (en.isIntersecting) { en.target.classList.add("revealed"); io.unobserve(en.target); }
      });
    }, { threshold: 0.12 });
    els.forEach(function (n) { io.observe(n); });
  })();
  </script>
</body>
</html>
